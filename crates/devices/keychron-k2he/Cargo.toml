[package]
name = "keychron-k2he"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hidapi.workspace = true
keychron-proto.workspace = true
myhub-core.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Pure-Rust backends, as in crates/transport/Cargo.toml (the workspace entry disables
# the default features, so the backend is chosen per target here).
[target.'cfg(windows)'.dependencies]
hidapi = { workspace = true, features = ["windows-native"] }

# hidraw through the udev crate; needs libudev (headers + pkg-config) at build time.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { workspace = true, features = ["linux-native"] }
