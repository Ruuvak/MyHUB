[package]
name = "myhub-rfcomm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# Windows Bluetooth (BluetoothAPIs) and Winsock (AF_BTH RFCOMM sockets). All unsafe
# code lives in src/windows.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }

# Linux (BlueZ): D-Bus (blocking zbus) lists paired devices; raw L2CAP/RFCOMM sockets
# go through libc. All unsafe code lives in src/linux.rs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
