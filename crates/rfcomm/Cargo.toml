[package]
name = "myhub-rfcomm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# Windows Bluetooth (BluetoothAPIs) and Winsock (AF_BTH RFCOMM sockets). All unsafe
# code lives in src/windows.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }
