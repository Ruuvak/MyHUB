[workspace]
resolver = "3"
members = [
    "crates/hidpp",
    "crates/core",
    "crates/transport",
    "crates/devices/logitech-g502x",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
hidpp = { path = "crates/hidpp" }
myhub-core = { path = "crates/core" }
myhub-transport = { path = "crates/transport" }
logitech-g502x = { path = "crates/devices/logitech-g502x" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Backend features are chosen per target in crates/transport/Cargo.toml.
hidapi = { version = "2", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
