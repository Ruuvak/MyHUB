[workspace]
resolver = "3"
members = [
    "crates/hidpp",
    "crates/mdr",
    "crates/keychron-proto",
    "crates/devices/keychron-k2he",
    "crates/rfcomm",
    "crates/devices/sony-wf-c710n",
    "crates/core",
    "crates/transport",
    "crates/devices/logitech-g502x",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
hidpp = { path = "crates/hidpp" }
mdr = { path = "crates/mdr" }
keychron-proto = { path = "crates/keychron-proto" }
keychron-k2he = { path = "crates/devices/keychron-k2he" }
myhub-rfcomm = { path = "crates/rfcomm" }
myhub-core = { path = "crates/core" }
myhub-transport = { path = "crates/transport" }
logitech-g502x = { path = "crates/devices/logitech-g502x" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Backend features are chosen per target in crates/transport/Cargo.toml.
hidapi = { version = "2", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
